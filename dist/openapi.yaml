openapi: 3.0.3
info:
  title: Adhkar API
  version: 1.0.0
  description: >
    REST API for Islamic supplications (adhkar / zekr). Serves categories of
    supplications, individual dhikr items (with optional audio and embedded
    Qur'an passages), full-text search, and random selection.
  license:
    name: MIT
servers:
  - url: http://localhost:3000
    description: Local development server
tags:
  - name: Meta
  - name: Categories
  - name: Adhkar
  - name: Audio
paths:
  /health:
    get:
      tags: [Meta]
      summary: Health check
      responses:
        "200":
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }
  /api/v1/meta:
    get:
      tags: [Meta]
      summary: Dataset metadata
      responses:
        "200":
          description: Dataset metadata
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiMeta" }
  /api/v1/categories:
    get:
      tags: [Categories]
      summary: List all categories
      responses:
        "200":
          description: List of categories
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Category" }
  /api/v1/categories/{slug}:
    get:
      tags: [Categories]
      summary: Get a category with all its items
      parameters:
        - $ref: "#/components/parameters/Slug"
      responses:
        "200":
          description: Category with items
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Category"
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: "#/components/schemas/AdhkarItem" }
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/categories/{slug}/items:
    get:
      tags: [Categories]
      summary: Get only the items of a category
      parameters:
        - $ref: "#/components/parameters/Slug"
      responses:
        "200":
          description: Items of the category
          content:
            application/json:
              schema:
                type: object
                properties:
                  slug: { type: string }
                  total: { type: integer }
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/AdhkarItem" }
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/categories/{slug}/items/{index}:
    get:
      tags: [Categories]
      summary: Get a single item by category slug and index
      parameters:
        - $ref: "#/components/parameters/Slug"
        - name: index
          in: path
          required: true
          schema: { type: integer, minimum: 0 }
      responses:
        "200":
          description: A single dhikr item
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdhkarItem" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/adhkar:
    get:
      tags: [Adhkar]
      summary: List and filter the flattened collection of all items
      parameters:
        - name: category
          in: query
          schema: { type: string }
          description: Filter by category slug
        - name: q
          in: query
          schema: { type: string }
          description: Substring match across zekr, description, reference, category
        - name: hasAudio
          in: query
          schema: { type: boolean }
        - name: hasQuran
          in: query
          schema: { type: boolean }
        - name: limit
          in: query
          schema: { type: integer, default: 50, minimum: 1, maximum: 200 }
        - name: offset
          in: query
          schema: { type: integer, default: 0, minimum: 0 }
        - $ref: "#/components/parameters/Reciter"
      responses:
        "200":
          description: Paginated list of items
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaginatedItems" }
  /api/v1/audio/reciters:
    get:
      tags: [Audio]
      summary: List the available reciters / audio sources
      responses:
        "200":
          description: List of reciters
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Reciter" }
  /api/v1/audio/ayah/{surah}/{ayah}:
    get:
      tags: [Audio]
      summary: Resolve audio URL(s) for a Qur'an ayah
      description: >
        Returns a map of reciter id to audio URL. Omit `reciter` to get every
        source; pass one to scope the result to a single reciter.
      parameters:
        - name: surah
          in: path
          required: true
          schema: { type: integer, minimum: 1, maximum: 114 }
        - name: ayah
          in: path
          required: true
          schema: { type: integer, minimum: 0 }
        - $ref: "#/components/parameters/Reciter"
      responses:
        "200":
          description: Resolved ayah audio
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ResolvedAyahAudio" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/search:
    get:
      tags: [Adhkar]
      summary: Full-text search across the Arabic text fields
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, default: 50, minimum: 1, maximum: 200 }
        - name: offset
          in: query
          schema: { type: integer, default: 0, minimum: 0 }
      responses:
        "200":
          description: Paginated search results
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaginatedItems" }
        "400":
          $ref: "#/components/responses/BadRequest"
  /api/v1/random:
    get:
      tags: [Adhkar]
      summary: Get a random dhikr
      parameters:
        - name: category
          in: query
          schema: { type: string }
          description: Optional category slug to scope the random pick
      responses:
        "200":
          description: A random dhikr item
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdhkarItemWithMeta" }
        "404":
          $ref: "#/components/responses/NotFound"
components:
  parameters:
    Slug:
      name: slug
      in: path
      required: true
      schema: { type: string }
      description: Category slug, e.g. "the-morning"
    Reciter:
      name: reciter
      in: query
      required: false
      schema: { type: string }
      description: >
        Reciter id. When present on item endpoints, embedded Qur'an ayahs are
        enriched with that reciter's resolved audioUrl. See /api/audio/reciters.
  responses:
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiError" }
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiError" }
  schemas:
    ApiMeta:
      type: object
      properties:
        version: { type: string }
        description: { type: string }
        totalCategories: { type: integer }
        totalItems: { type: integer }
    Category:
      type: object
      properties:
        slug: { type: string, example: the-morning }
        fileId: { type: string, example: adhkar_the_morning }
        title: { type: string, example: "أذكار الصباح" }
        count: { type: integer }
    Ayah:
      type: object
      properties:
        number: { type: integer }
        text: { type: string }
        audio: { type: string }
        audioUrl:
          type: string
          description: Resolved external URL, present when a reciter was requested
    Basmala:
      type: object
      properties:
        text: { type: string }
        audio: { type: string }
        audioUrl:
          type: string
          description: Resolved external URL, present when a reciter was requested
    Reciter:
      type: object
      properties:
        id: { type: string, example: husary }
        name: { type: string, example: "Mahmoud Khalil Al-Husary" }
        source: { type: string, enum: [everyayah] }
        path: { type: string, example: Husary_128kbps }
        bitrate: { type: string, example: 128kbps }
    ResolvedAyahAudio:
      type: object
      properties:
        surah: { type: integer, example: 3 }
        ayah: { type: integer, example: 191 }
        sources:
          type: object
          additionalProperties: { type: string }
          description: Map of reciter id to audio URL
          example:
            husary: https://everyayah.com/data/Husary_128kbps/003191.mp3
    Quran:
      type: object
      properties:
        basmala: { $ref: "#/components/schemas/Basmala" }
        ayahs:
          type: array
          items: { $ref: "#/components/schemas/Ayah" }
    LocalizedText:
      type: object
      properties:
        ar: { type: string, nullable: true }
        en: { type: string, nullable: true }
    MediaIcon:
      type: object
      nullable: true
      properties:
        src: { type: string, example: /assets/icons/adhan/1.png }
        alt: { type: string }
    MediaAudio:
      type: object
      properties:
        reciter: { type: string, example: default }
        src: { type: string, example: /assets/audio/adhan/1.mp3 }
        duration:
          type: number
          nullable: true
          description: Length in seconds, when known
    Media:
      type: object
      properties:
        icon:
          allOf: [{ $ref: "#/components/schemas/MediaIcon" }]
          nullable: true
        audio:
          type: array
          items: { $ref: "#/components/schemas/MediaAudio" }
    ItemMeta:
      type: object
      properties:
        reference: { type: string, nullable: true }
        count:
          oneOf: [{ type: integer }, { type: string }]
          example: 1
    AdhkarItem:
      type: object
      properties:
        id: { type: integer, example: 77 }
        slug: { type: string, example: adhan-1 }
        category: { type: string, example: adhan }
        categoryTitle: { type: string, example: "أذكار الأذان" }
        content: { $ref: "#/components/schemas/LocalizedText" }
        description: { $ref: "#/components/schemas/LocalizedText" }
        meta: { $ref: "#/components/schemas/ItemMeta" }
        media: { $ref: "#/components/schemas/Media" }
        quran: { $ref: "#/components/schemas/Quran" }
    AdhkarItemWithMeta:
      allOf:
        - $ref: "#/components/schemas/AdhkarItem"
        - type: object
          properties:
            categorySlug: { type: string }
            index: { type: integer }
    PaginatedItems:
      type: object
      properties:
        total: { type: integer }
        limit: { type: integer }
        offset: { type: integer }
        count: { type: integer }
        items:
          type: array
          items: { $ref: "#/components/schemas/AdhkarItemWithMeta" }
    ApiError:
      type: object
      properties:
        error: { type: string }
        message: { type: string }
